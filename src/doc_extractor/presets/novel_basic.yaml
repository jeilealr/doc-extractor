profile_schema_version: 1
id: preset.document.novel.basic.v1
version: 1.0.0
kind: preset
format: pdf
purpose: Preserve source lines in text layer order without spelling correction.
pipeline:
  - op: pdf.collect_text_blocks
    as: text_blocks
    params: {preserve_raw: true, include_page_and_bbox: true}
output: {kind: document}
validation: {require_provenance: true}

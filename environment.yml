name: doc-extractor

channels:
  - conda-forge

dependencies:
  - python=3.11
  - pip
  - setuptools>=68
  - wheel

  # PDF extraction
  - pdfplumber>=0.11,<0.13
  - pyyaml>=6,<7

  # Data processing
  - polars>=1.20,<3
  - pyarrow>=18,<25
  - duckdb>=1.1,<3
  - pandas>=2.1,<4

  # Development and testing
  - pytest>=8,<10
  - pytest-cov>=5,<9
  - ruff>=0.17,<0.18
  - reportlab>=4,<5

  # Documentation (make -C docs html)
  - sphinx>=7,<9
  - pydata-sphinx-theme>=0.15,<1
  - myst-parser>=3,<5
  - sphinx-design>=0.6,<1
  - sphinx-copybutton>=0.5,<1

  - pip:
      - build>=1.2,<2
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "doc-extractor"
version = "0.1.0"
description = "Local-first, source-traceable PDF and CSV extraction with conservative YAML profiles"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "doc-extractor contributors"}]
keywords = ["pdf", "csv", "extraction", "provenance", "polars"]
dependencies = ["pdfplumber>=0.11,<0.13", "PyYAML>=6,<7"]

[project.optional-dependencies]
tabular = ["polars>=1.20,<3"]
arrow = ["polars>=1.20,<3", "pyarrow>=18,<25"]
sql = ["duckdb>=1.1,<3"]
pandas = ["pandas>=2.1,<4", "polars>=1.20,<3", "pyarrow>=18,<25"]
all = ["polars>=1.20,<3", "pyarrow>=18,<25", "duckdb>=1.1,<3", "pandas>=2.1,<4"]
docs = ["sphinx>=7,<9", "pydata-sphinx-theme>=0.15,<1", "myst-parser>=3,<5",
        "sphinx-design>=0.6,<1", "sphinx-copybutton>=0.5,<1"]
dev = ["pytest>=8,<10", "pytest-cov>=5,<9", "ruff>=0.17,<0.18", "build>=1.2,<2", "reportlab>=4,<5"]

[project.scripts]
doc-extractor = "doc_extractor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
doc_extractor = ["presets/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
branch = true
source = ["doc_extractor"]

[tool.coverage.report]
show_missing = true
fail_under = 100

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["docs/private", "private", ".private"]

[tool.ruff.format]
# Black-compatible formatting (FINAM uses black + isort; ruff provides both in one tool).
quote-style = "double"
docstring-code-format = true

[tool.ruff.lint]
# E/F: pycodestyle + pyflakes, I: isort, B: bugbear, UP: pyupgrade, S: bandit (security)
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
# Tests run trusted subprocesses and use seeded, non-cryptographic randomness on purpose.
"tests/**" = ["S603", "S311"]

[tool.ruff.lint.isort]
known-first-party = ["doc_extractor"]
